<style>
  :root{
    --bg:#F4F5F8;
    --panel:#FFFFFF;
    --panel-alt:#F0F2F6;
    --ink:#22242C;
    --ink-dim:#6B6F7B;
    --rule:#E1E4EA;
    --accent:#2F6FED;
    --accent-soft:rgba(47,111,237,0.10);
    --amber:#B8860B;
    --green:#1E8E5A;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 18px 60px;
  }

  .wrap{
    max-width:1200px;
    margin:0 auto;
  }

  .wrap.wide{
    max-width:1400px;
  }

  .lockup{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:8px;
  }

  .lockup h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:0.02em;
    margin:0;
  }

  .lockup .who{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink-dim);
  }

  .who a{
    color:var(--accent);
    text-decoration:none;
    cursor:pointer;
    margin-left:10px;
  }

  .who a:hover{
    text-decoration:underline;
  }

  .conn-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Inter',sans-serif;
    font-size:11px;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--rule);
    cursor:default;
    white-space:nowrap;
  }

  .conn-badge.checking{
    color:var(--ink-dim);
  }

  .conn-badge.ok{
    color:var(--green);
    border-color:rgba(95,191,122,0.4);
    background:rgba(95,191,122,0.08);
  }

  .conn-badge.bad{
    color:var(--accent);
    border-color:rgba(230,57,70,0.4);
    background:rgba(230,57,70,0.08);
    cursor:help;
  }

  .slate{
    background:var(--panel);
    border-radius:6px;
    overflow:hidden;
    border:1px solid var(--rule);
  }

  .slate-stripe{
    height:6px;
    background:var(--accent);
  }

  .slate-body{
    padding:22px 22px 26px;
  }

  .field{
    margin-bottom:16px;
  }

  .field label{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }

  .field input,
  .field select,
  .field textarea{
    width:100%;
    background:var(--panel-alt);
    border:1px solid var(--rule);
    border-radius:4px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
  }

  .field textarea{
    resize:vertical;
    min-height:60px;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }

  .row3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
  }

  @media(max-width:600px){
    .row2,
    .row3{
      grid-template-columns:1fr;
    }
  }

  button.primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px;
    cursor:pointer;
    margin-top:6px;
  }

  button.primary:hover{
    background:#d02e3b;
  }

  button.primary:disabled{
    opacity:0.5;
    cursor:default;
  }

  button.secondary{
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 16px;
    cursor:pointer;
    margin:6px 6px 6px 0;
  }

  button.secondary:hover{
    opacity:0.8;
  }

  button.ghost{
    background:transparent;
    border:1px solid var(--rule);
    color:var(--ink);
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:9px 14px;
    cursor:pointer;
  }

  button.ghost:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  button.btn-small{
    background:var(--panel-alt);
    border:1px solid var(--rule);
    color:var(--ink);
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:6px 13px;
    cursor:pointer;
    margin-left:8px;
  }

  button.btn-small:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  button.btn-edit,
  button.btn-delete{
    border:1px solid var(--rule);
    border-radius:6px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    padding:6px 11px;
    cursor:pointer;
    margin-right:8px;
    background:var(--panel-alt);
  }

  button.btn-edit{
    color:var(--amber);
    border-color:rgba(184,134,11,0.35);
  }

  button.btn-edit:hover{
    background:rgba(184,134,11,0.10);
  }

  button.btn-delete{
    color:var(--accent);
    border-color:rgba(230,57,70,0.35);
    margin-right:0;
  }

  button.btn-delete:hover{
    background:rgba(230,57,70,0.08);
  }

  button.btn-icon{
    background:var(--panel-alt);
    border:1px solid var(--rule);
    color:var(--ink-dim);
    border-radius:6px;
    font-size:13px;
    padding:5px 9px;
    cursor:pointer;
    margin-left:8px;
  }

  button.btn-icon:hover{
    border-color:var(--accent);
    color:var(--accent);
  }

  .msg{
    font-family:'Inter',sans-serif;
    font-size:12px;
    margin-top:10px;
    min-height:14px;
  }

  .msg.ok{
    color:var(--green);
  }

  .msg.err{
    color:var(--accent);
  }

  .msg.info{
    color:var(--amber);
  }

  .section-title{
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    margin:30px 0 12px;
  }

  .entry{
    display:flex;
    gap:14px;
    padding:13px 0;
    border-bottom:1px solid var(--rule);
    align-items:flex-start;
  }

  .entry .tc{
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink-dim);
    width:78px;
    flex-shrink:0;
    padding-top:2px;
  }

  .entry .main{
    flex:1;
    min-width:0;
  }

  .entry .brand{
    font-weight:600;
    font-size:14.5px;
  }

  .entry .meta{
    font-size:13px;
    color:var(--ink-dim);
    margin-top:2px;
  }

  .entry .member{
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--ink-dim);
  }

  .badge{
    display:inline-block;
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    letter-spacing:0.04em;
    padding:2px 8px;
    border-radius:20px;
    flex-shrink:0;
    margin-left:8px;
  }

  .badge.shot{
    background:rgba(148,143,160,0.18);
    color:var(--ink-dim);
  }

  .badge.editing{
    background:rgba(242,183,5,0.16);
    color:var(--amber);
  }

  .badge.delivered{
    background:rgba(95,191,122,0.16);
    color:var(--green);
  }

  .empty{
    color:var(--ink-dim);
    font-size:13.5px;
    padding:20px 0;
    font-family:'Inter',sans-serif;
  }

  .table-wrapper{
    overflow-x:auto;
    margin-bottom:30px;
  }

  .data-table{
    width:100%;
    border-collapse:collapse;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:6px;
    overflow:hidden;
    font-size:13px;
  }

  .data-table thead{
    background:var(--panel-alt);
  }

  .data-table th{
    padding:12px;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    border-bottom:1px solid var(--rule);
    white-space:nowrap;
  }

  .data-table td{
    padding:12px;
    border-bottom:1px solid var(--rule);
    white-space:nowrap;
  }

  .data-table tr:hover{
    background:var(--panel-alt);
  }

  .data-table .number{
    text-align:right;
    font-family:'Inter',sans-serif;
  }

  .search-section{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:22px;
    margin-bottom:30px;
  }

  .search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }

  .search-box input{
    flex:1;
    background:var(--panel-alt);
    border:1px solid var(--rule);
    border-radius:4px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:10px 12px;
  }

  .search-box input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .member-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-top:20px;
  }

  @media(max-width:600px){
    .member-stats{
      grid-template-columns:repeat(2,1fr);
    }
  }

  .member-stat{
    background:var(--panel-alt);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:14px;
  }

  .member-stat .label{
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:8px;
  }

  .member-stat .value{
    font-size:24px;
    font-weight:700;
    color:var(--accent);
  }

  .member-details{
    margin-top:20px;
  }

  .member-details h3{
    margin:0 0 16px;
    font-size:16px;
    color:var(--accent);
  }

  .gate{
    max-width:380px;
    margin:80px auto 0;
  }

  .gate .slate-body{
    padding:26px 24px 28px;
  }

  .gate h2{
    font-size:17px;
    margin:0 0 4px;
  }

  .gate p{
    font-size:13px;
    color:var(--ink-dim);
    margin:0 0 18px;
  }

  .namelist{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
    gap:10px;
    margin-bottom:14px;
  }

  .namechip{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    text-align:center;
    padding:12px 10px;
    border:1px solid var(--rule);
    border-radius:8px;
    cursor:pointer;
    background:var(--panel-alt);
    box-shadow:0 1px 2px rgba(20,20,30,0.04);
  }

  .namechip:hover{
    border-color:var(--accent);
    box-shadow:0 2px 6px rgba(47,111,237,0.15);
  }

  .namechip.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent);
  }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:16px 0;
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-size:10.5px;
  }

  .divider::before,
  .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--rule);
  }

  .admin-link{
    text-align:center;
    margin-top:22px;
  }

  .admin-link a{
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    cursor:pointer;
    text-decoration:none;
  }

  .admin-link a:hover{
    color:var(--accent);
  }

  .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:26px;
  }

  @media(max-width:600px){
    .stats{
      grid-template-columns:repeat(2,1fr);
    }
  }

  .stat{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:14px;
  }

  .stat .n{
    font-family:'Inter',sans-serif;
    font-size:24px;
    font-weight:700;
  }

  .stat .l{
    font-size:11px;
    color:var(--ink-dim);
    margin-top:2px;
  }

  .filters{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }

  .filters select{
    background:var(--panel-alt);
    border:1px solid var(--rule);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:8px 10px;
    border-radius:4px;
  }

  .bar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }

  .bar-row .name{
    width:110px;
    flex-shrink:0;
    font-family:'Inter',sans-serif;
    font-size:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .bar-track{
    flex:1;
    background:var(--panel-alt);
    border-radius:3px;
    height:9px;
    overflow:hidden;
  }

  .bar-fill{
    height:100%;
    background:var(--accent);
  }

  .bar-row .cnt{
    width:22px;
    text-align:right;
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink-dim);
  }

  .reset-link{
    text-align:center;
    margin-top:40px;
  }

  .reset-link a{
    color:var(--ink-dim);
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    cursor:pointer;
    text-decoration:underline;
  }

  .button-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
  }

  .loading-spinner{
    display:inline-block;
    width:20px;
    height:20px;
    border:3px solid var(--rule);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }

  @keyframes spin{
    to{
      transform:rotate(360deg);
    }
  }

  .firebase-status{
    margin-top:8px;
    font-family:'Inter',sans-serif;
    font-size:10px;
    color:var(--ink-dim);
  }

  @media(max-width:480px){
    body{
      padding:20px 12px 40px;
    }

    .slate-body{
      padding:18px;
    }

    .lockup h1{
      font-size:17px;
    }

    .data-table{
      font-size:12px;
    }

    .data-table th,
    .data-table td{
      padding:9px;
    }
  }

  /* ===== Showcasy-style form ===== */
  .sc-form{max-width:680px;margin:0 auto;padding:28px 0 10px;}
  .sc-title{font-size:clamp(40px,8vw,72px);line-height:.98;font-weight:700;letter-spacing:-0.045em;text-align:center;margin:0 0 18px;color:#0A0B14;}
  .sc-title .dim{color:#A9ADB8;}

  .sc-field input,.sc-field textarea,.sc-field select{width:100%;border:none;border-bottom:1px solid #D5D8DF;border-radius:0;background:transparent;font-family:'Inter',sans-serif;font-size:15px;color:#0A0B14;padding:12px 12px 14px;outline:none;}
  .sc-field input::placeholder,.sc-field textarea::placeholder{color:#8A8F9E;}
  .sc-field input:focus,.sc-field textarea:focus{border-bottom-color:#0A0B14;outline:none;}
  .sc-field textarea{min-height:110px;resize:vertical;}
  .sc-row{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .sc-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;}
  @media(max-width:600px){.sc-row,.sc-row3{grid-template-columns:1fr;gap:0;}}
  .sc-chips{display:flex;flex-wrap:wrap;gap:12px;}
  .sc-chip{font-family:'Inter',sans-serif;font-size:14px;color:#0A0B14;background:#F6F7F9;border:1px solid #C9CCD5;border-radius:999px;padding:11px 18px;cursor:pointer;transition:all .15s;}
  .sc-chip:hover{border-color:#0A0B14;}
  .sc-chip.on{background:#D6D9E3;border-color:#0A0B14;}
  .sc-drop{border:1.5px dashed #C9CCD5;border-radius:20px;padding:30px 20px;text-align:center;cursor:pointer;background:#F6F7F9;transition:all .15s;}
  .sc-drop:hover,.sc-drop.over{border-color:#0A0B14;background:#ECEEF3;}
  .sc-drop .ic{width:44px;height:44px;border-radius:50%;border:1px solid #C9CCD5;background:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .sc-drop .t{font-size:14px;font-weight:500;color:#0A0B14;}
  .sc-drop .h{font-size:12.5px;color:#8A8F9E;margin-top:4px;}
  .sc-preview{position:relative;display:inline-block;max-width:100%;}
  .sc-preview img{display:block;max-width:100%;max-height:300px;border-radius:16px;border:1px solid #D5D8DF;}
  .sc-preview button{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:none;background:#0A0B14;color:#fff;font-size:16px;cursor:pointer;line-height:1;}

  .sc-submit{display:inline-flex;align-items:center;gap:12px;background:#05060F;color:#fff;border:none;border-radius:999px;font-family:'Inter',sans-serif;font-size:17px;font-weight:500;padding:19px 34px;cursor:pointer;}
  .sc-submit:hover{background:#1B1D2B;}
  .sc-submit:disabled{opacity:.5;cursor:default;}
  .sc-view{background:transparent;border:1px solid #C9CCD5;border-radius:999px;font-family:'Inter',sans-serif;font-size:12px;padding:5px 12px;cursor:pointer;color:#0A0B14;}
  .sc-view:hover{border-color:#0A0B14;}
  .sc-lightbox{position:fixed;inset:0;background:rgba(5,6,15,.88);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;}
  .sc-lightbox img{max-width:100%;max-height:100%;border-radius:12px;background:#fff;}
  .sc-lightbox .x{position:absolute;top:18px;right:22px;color:#fff;font-size:30px;cursor:pointer;background:none;border:none;}
</style>
</head>

/* ============================================================
   LOCAL CACHE (so a page refresh never wipes data, even if
   Firebase is briefly unreachable or a write is rejected by
   the database rules)
   ============================================================ */

const LS_ENTRIES_KEY = "tk_cache_entries";
const LS_MEMBERS_KEY = "tk_cache_members";

function cacheEntries(){

  try{

    localStorage.setItem(
      LS_ENTRIES_KEY,
      JSON.stringify(state.entries)
    );

  }catch(error){

    console.error("Could not cache entries locally:", error);

  }

}

function cacheMembers(){

  try{

    localStorage.setItem(
      LS_MEMBERS_KEY,
      JSON.stringify(state.members)
    );

  }catch(error){

    console.error("Could not cache members locally:", error);

  }

}

function loadCachedEntries(){

  try{

    const raw = localStorage.getItem(LS_ENTRIES_KEY);

    return raw ? JSON.parse(raw) : [];

  }catch(error){

    return [];

  }

}

function loadCachedMembers(){

  try{

    const raw = localStorage.getItem(LS_MEMBERS_KEY);

    return raw ? JSON.parse(raw) : [];

  }catch(error){

    return [];

  }

}


/* ============================================================
   REAL CONNECTION TEST

   This is the important addition: earlier, a failed Firebase
   write/read was only logged to the browser console, so the
   app looked "fine" on the device that made it (because of the
   local cache) while silently never reaching Firebase at all —
   which is exactly why other devices saw nothing. This does an
   actual write + read round trip against the database so we
   know for certain whether syncing is really working, and shows
   it in the UI instead of hiding it in the console.
   ============================================================ */

const LS_BRANDS_KEY = "tk_cache_brands";

function cacheBrands(){

  try{

    localStorage.setItem(
      LS_BRANDS_KEY,
      JSON.stringify(state.brands)
    );

  }catch(error){

    console.error("Could not cache brands locally:", error);

  }

}

function loadCachedBrands(){

  try{

    const raw = localStorage.getItem(LS_BRANDS_KEY);

    return raw ? JSON.parse(raw) : [];

  }catch(error){

    return [];

  }

}

async function saveBrands(){

  cacheBrands();

  if(!db){

    throw new Error("Firebase database is unavailable.");

  }

  const brandsObj = {};

  state.brands.forEach(brand=>{

    brandsObj[brand.id] = brand;

  });

  /* _meta keeps the node alive even when the last brand is
     deleted, so other devices see "empty" instead of reviving
     their stale cached copy. */

  brandsObj._meta = { saved: Date.now() };

  try{

    await db.ref("brands").set(brandsObj);

  }catch(error){

    state.brandsDirty = true;

    throw error;

  }

  state.brandsDirty = false;

  return true;

}

async function testFirebaseConnection(){

  if(!db){

    return { state:"bad", reason:"Firebase failed to initialize" };

  }

  try{

    const ref = db.ref("_connectionTest");

    await ref.set({ ts: Date.now() });

    const snap = await ref.once("value");

    if(snap.exists()){

      return { state:"ok", reason:null };

    }

    return {
      state:"bad",
      reason:"Write succeeded but read-back returned nothing — check Database Rules"
    };

  }catch(error){

    return {
      state:"bad",
      reason:
        (error && error.message) ||
        "Firebase rejected the request — check Database Rules"
    };

  }

}

async function refreshConnectionStatus(){

  state.connectionStatus = { state:"checking", reason:null };

  render();

  state.connectionStatus = await testFirebaseConnection();

  render();

}


/* ============================================================
   LOAD ALL DATA
   ============================================================ */

async function loadAll(){

  /* Seed from the local cache first. This is what actually
     protects the data on refresh: if the Firebase read below
     fails (offline, denied by database rules, etc.) we simply
     keep what was already on this device instead of wiping it. */

  state.members = loadCachedMembers();

  state.entries = loadCachedEntries();


  if(!db){

    state.view = "error";

    state.errorMsg =
      "Firebase failed to initialize. Check the Firebase configuration.";

    state.connectionStatus = { state:"bad", reason:"Firebase failed to initialize" };

    render();

    return;

  }


  let membersSynced = false;

  let entriesSynced = false;


  try{

    const membersSnap =
      await db.ref("members").once("value");

    const membersData = membersSnap.val();

    if(membersData){

      state.members =
        Object.entries(membersData)
          .filter(([key,value])=>
            key !== "_meta" &&
            typeof value === "string"
          )
          .map(([key,value])=>value);

      cacheMembers();

      membersSynced = true;

    }
    /* If Firebase legitimately has nothing yet, keep the
       cached members instead of clearing them. */

  }catch(error){

    console.error("Load members failed (keeping local cache):", error);

  }


  try{

    const entriesSnap =
      await db.ref("entries").once("value");

    const entriesData = entriesSnap.val();

    if(entriesData){

      state.entries =
        Object.values(entriesData);

      cacheEntries();

      entriesSynced = true;

    }
    /* If Firebase legitimately has nothing yet, keep the
       cached entries instead of clearing them. */

  }catch(error){

    console.error("Load entries failed (keeping local cache):", error);

  }


  let brandsSynced = false;

  state.brands = loadCachedBrands();

  try{

    const brandsSnap =
      await db.ref("brands").once("value");

    const brandsData = brandsSnap.val();

    if(brandsData){

      state.brands =
        Object.entries(brandsData)
          .filter(([key,value])=>
            key !== "_meta" &&
            value &&
            typeof value === "object"
          )
          .map(([key,value])=>value);

      cacheBrands();

      brandsSynced = true;

    }

  }catch(error){

    console.error("Load brands failed (keeping local cache):", error);

  }

  state.brands.sort(
    (a,b)=>String(a.name||"").localeCompare(String(b.name||""))
  );

  if(state.brands.length && !brandsSynced){

    saveBrands().catch(error=>{
      console.error("Re-sync of cached brands failed:", error);
    });

  }


  await loadMessages();

  state.entries.sort(
    (a,b) =>
      new Date(b.date || 0) -
      new Date(a.date || 0)
  );


  /* If we had cached data that Firebase didn't return, push it
     back up so it gets properly persisted server-side too. */

  if(state.members.length && !membersSynced){

    saveMembers().catch(error=>{
      console.error("Re-sync of cached members failed:", error);
    });

  }

  if(state.entries.length && !entriesSynced){

    saveEntries().catch(error=>{
      console.error("Re-sync of cached entries failed:", error);
    });

  }


  const savedUser =
    localStorage.getItem("currentUser");


  if(savedUser && !state.members.includes(savedUser)){

    /* This person was deleted by the admin (or never existed). */

    localStorage.removeItem("currentUser");

  }

  if(savedUser && state.members.includes(savedUser)){

    state.currentUser = savedUser;

    state.view = "member";

  }else{

    state.view = "gate";

  }


  render();


  /* Run the real read+write round-trip test after the first
     paint so the UI shows an honest, verified sync status
     instead of just "it loaded so it must be fine". */

  refreshConnectionStatus();

}


/* ============================================================
   SAVE MEMBERS
   ============================================================ */

async function saveMembers(){

  /* Always cache locally first — this is what survives a
     refresh even if the Firebase write below fails. */

  cacheMembers();


  if(!db){

    throw new Error("Firebase database is unavailable.");

  }

  try{

    const membersObj = {};

    state.members.forEach((member,index)=>{

      membersObj[index] = member;

    });

    /* _meta lets the node survive even if every person is
       deleted, so other devices don't revive old cached names. */

    membersObj._meta = { saved: Date.now() };

    await db.ref("members").set(membersObj);

    return true;

  }catch(error){

    console.error("Save members failed (kept in local cache):",error);

    throw error;

  }

}


/* ============================================================
   SAVE ENTRIES
   ============================================================ */

async function saveEntries(){

  /* Always cache locally first — this is what survives a
     refresh even if the Firebase write below fails. */

  cacheEntries();


  if(!db){

    throw new Error("Firebase database is unavailable.");

  }

  try{

    const entriesObj = {};

    state.entries.forEach((entry,index)=>{

      entriesObj[entry.id || index] = entry;

    });

    await db.ref("entries").set(entriesObj);

    return true;

  }catch(error){

    console.error("Save entries failed (kept in local cache):",error);

    throw error;

  }

}


/* ============================================================
   MANUAL SYNC (push whatever is cached on this device up to
   Firebase — useful after fixing Firebase Rules, or after a
   period offline)
   ============================================================ */

async function syncAllToFirebase(){

  state.syncMsg = {
    type:"info",
    text:"Syncing..."
  };

  render();


  let membersOk = true;
  let entriesOk = true;

  let brandsOk = true;


  try{
    await saveMembers();
  }catch(error){
    membersOk = false;
  }

  try{
    await saveEntries();
  }catch(error){
    entriesOk = false;
  }

  try{
    await saveBrands();
  }catch(error){
    brandsOk = false;
  }


  if(membersOk && entriesOk && brandsOk){

    state.syncMsg = {
      type:"ok",
      text:"✓ Synced to Firebase."
    };

  }else{

    state.syncMsg = {
      type:"err",
      text:"❌ Sync failed — check your Firebase Database Rules (they likely need to allow read/write)."
    };

  }


  render();


  refreshConnectionStatus();


  setTimeout(()=>{

    state.syncMsg = null;

    render();

  }, 3500);

}

/* ============================================================
   SCREENSHOTS
   Images are shrunk in the browser (max 1280px JPEG) and kept in
   their own database node "screenshots/<entryId>" so the main
   entries list stays light. Entries only carry hasScreenshot:true.
   ============================================================ */

const LS_SHOT_PREFIX = "tk_shot_";

function compressImage(file){
  return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith("image/")){
      reject(new Error("Please choose an image file."));
      return;
    }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("Could not read that file."));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("That image could not be opened."));
      img.onload = ()=>{
        const MAX = 1280;
        let w = img.width, h = img.height;
        if(Math.max(w,h) > MAX){
          const k = MAX / Math.max(w,h);
          w = Math.round(w*k); h = Math.round(h*k);
        }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg",0.78));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleScreenshotFile(file){
  try{
    state.form.screenshot = await compressImage(file);
    state.formMsg = null;
  }catch(err){
    state.formMsg = { type:"err", text: err.message };
  }
  render();
}

async function saveScreenshot(id,dataUrl){
  try{ localStorage.setItem(LS_SHOT_PREFIX+id,dataUrl); }catch(e){}
  if(!db) throw new Error("Firebase database is unavailable.");
  await db.ref("screenshots/"+id).set(dataUrl);
}

async function loadScreenshot(id){
  try{
    if(db){
      const snap = await db.ref("screenshots/"+id).once("value");
      if(snap.exists()) return snap.val();
    }
  }catch(e){ console.error("Screenshot load failed:",e); }
  try{ return localStorage.getItem(LS_SHOT_PREFIX+id); }catch(e){ return null; }
}

async function viewScreenshot(id){
  const box = document.createElement("div");
  box.className = "sc-lightbox";
  box.innerHTML = '<button class="x" aria-label="Close">×</button><div class="loading-spinner" style="border-top-color:#fff"></div>';
  box.onclick = ()=>box.remove();
  document.body.appendChild(box);
  const data = await loadScreenshot(id);
  if(!box.isConnected) return;
  if(!data){
    box.innerHTML = '<button class="x">×</button><div style="color:#fff;font-size:14px">Screenshot not available.</div>';
    return;
  }
  box.innerHTML = '<button class="x">×</button>';
  const img = document.createElement("img");
  img.src = data;
  img.onclick = e=>e.stopPropagation();
  box.appendChild(img);
}

const shotCache = {};

function adminShotCell(entry){
  const td = el("td");
  if(!entry.hasScreenshot){ td.textContent = "-"; return td; }
  const thumb = el("div",{
    style:"width:56px;height:56px;border-radius:10px;border:1px solid var(--rule);background:var(--panel-alt);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-dim);",
    title:"Click to enlarge",
    text:"…",
    onclick:()=>viewScreenshot(entry.id)
  });
  const show = data=>{
    thumb.textContent = "";
    if(!data){ thumb.textContent = "n/a"; return; }
    const img = el("img",{src:data,alt:"Screenshot",style:"width:100%;height:100%;object-fit:cover;display:block;"});
    thumb.appendChild(img);
  };
  if(shotCache[entry.id] !== undefined){ show(shotCache[entry.id]); }
  else{
    loadScreenshot(entry.id).then(d=>{ shotCache[entry.id] = d; show(d); });
  }
  td.appendChild(thumb);
  return td;
}

function screenshotCell(entry){
  const td = el("td");
  if(entry.hasScreenshot){
    td.appendChild(el("button",{class:"sc-view",text:"View",onclick:()=>viewScreenshot(entry.id)}));
  }else{
    td.textContent = "-";
  }
  return td;
}


/* ============================================================
   SUBMIT SHOOT
   ============================================================ */

async function submitEntry(){

  if(!state.form.brand.trim()){

    state.formMsg = {
      type:"err",
      text:"Brand is required."
    };

    render();

    return;

  }


  if(!state.currentUser){

    state.formMsg = {
      type:"err",
      text:"Please select your name first."
    };

    render();

    return;

  }


  state.isLoading = true;

  state.formMsg = null;

  render();


  const entry = {

    id: Date.now().toString(),

    member: state.currentUser,

    date: state.form.date,

    brand: state.form.brand.trim(),

    contentType: state.form.contentType,

    location: state.form.location.trim(),

    status: state.form.status,

    notes: state.form.notes.trim(),

    approvedBy: state.form.approvedBy.trim(),

    coordinator: state.form.coordinator.trim(),

    reelTopic: state.form.reelTopic.trim(),

    pay: state.form.pay
      ? parseFloat(state.form.pay)
      : 0,

    travel: state.form.travel
      ? parseFloat(state.form.travel)
      : 0,

    hasScreenshot: !!state.form.screenshot

  };

  const shotData = state.form.screenshot;


  state.entries.unshift(entry);

  /* Cache immediately so the entry survives a refresh even if
     the Firebase write below fails or is slow. */

  cacheEntries();


  try{

    if(shotData){
      await saveScreenshot(entry.id, shotData);
    }

    await saveEntries();

    resetForm();

    state.formMsg = {
      type:"ok",
      text:"✓ Shoot logged successfully!"
    };

    state.connectionStatus = { state:"ok", reason:null };

  }catch(error){

    /* Keep the entry locally — do NOT remove it. It's saved on
       this device and will sync to Firebase automatically next
       time the app loads or "Sync now" is pressed in Admin. */

    state.formMsg = {
      type:"info",
      text:"⚠ Saved on this device, but couldn't sync to Firebase yet (check Firebase Rules). It will retry automatically."
    };

    state.connectionStatus = {
      state:"bad",
      reason: (error && error.message) || "Firebase rejected the write — check Database Rules"
    };

    console.error(error);

  }


  state.isLoading = false;

  render();


  if(state.formMsg?.type === "ok"){

    setTimeout(()=>{

      state.formMsg = null;

      render();

    },2000);

  }

}


/* ============================================================
   FORMAT DATE
   ============================================================ */

function fmtDate(iso){

  if(!iso) return "-";

  const d =
    new Date(iso + "T00:00:00");

  if(isNaN(d.getTime())) return iso;

  return d.toLocaleDateString(
    "en-US",
    {
      month:"short",
      day:"numeric",
      year:"numeric"
    }
  );

}

function statusBadgeClass(status){

  if(status === "Delivered")
    return "delivered";

  return "shot";

}


/* ============================================================
   ELEMENT HELPER
   ============================================================ */

function el(tag,attrs={}){

  const elem =
    document.createElement(tag);


  if(attrs.text !== undefined)
    elem.textContent = attrs.text;


  if(attrs.html !== undefined)
    elem.innerHTML = attrs.html;


  if(attrs.onclick)
    elem.onclick = attrs.onclick;


  if(attrs.style)
    elem.style.cssText = attrs.style;


  if(attrs.title)
    elem.title = attrs.title;


  if(attrs.class !== undefined)
    elem.className = attrs.class;


  delete attrs.text;
  delete attrs.html;
  delete attrs.onclick;
  delete attrs.style;
  delete attrs.title;
  delete attrs.class;


  Object.assign(elem,attrs);


  return elem;

}


/* ============================================================
   CONNECTION BADGE (shown in every header)
   ============================================================ */

function renderConnectionBadge(){

  const status = state.connectionStatus || { state:"checking" };


  let cls = "checking";

  let label = "Checking connection...";

  let title = "";


  if(status.state === "ok"){

    cls = "ok";

    label = "🟢 Saved online";

  }else if(status.state === "bad"){

    cls = "bad";

    label = "🔴 Not saved online yet";

    title =
      "Your entries are safe on this device, but they haven't reached the shared cloud storage yet, so other people won't see them. (For the team leader: check Firebase Database Rules.)";

  }


  return el("span",{

    class:"conn-badge " + cls,

    text:label,

    title:title

  });

}

/* ============================================================
   EXPORT TO EXCEL (generic — used for "all" and "single member")
   ============================================================ */

function xlsxIsReady(){

  return typeof XLSX !== "undefined";

}

function waitForXlsxThenRun(callback, attemptsLeft){

  if(xlsxIsReady()){

    callback();

    return;

  }


  if(attemptsLeft === undefined){

    attemptsLeft = 20;

  }


  if(attemptsLeft <= 0){

    alert(
      "Could not load the Excel library. Check your internet connection and refresh the page."
    );

    return;

  }


  /* The fallback CDN script may still be loading — retry briefly before giving up */

  setTimeout(()=>{

    waitForXlsxThenRun(callback, attemptsLeft - 1);

  }, 250);

}

const EXPORT_COLUMNS = [
  { header:"Date",         key:"date",         width:12 },
  { header:"Member",       key:"member",       width:16 },
  { header:"Brand",        key:"brand",        width:20 },
  { header:"Reel Topic",   key:"reelTopic",    width:22 },
  { header:"Content Type", key:"contentType",  width:14 },
  { header:"Location",     key:"location",     width:22 },
  { header:"Approved By",  key:"approvedBy",   width:18 },
  { header:"Coordinator",  key:"coordinator",  width:18 },
  { header:"Pay (₹)",      key:"pay",          width:12 },
  { header:"Travel (₹)",   key:"travel",       width:12 },
  { header:"Status",       key:"status",       width:12 },
  { header:"Notes",        key:"notes",        width:40 }
];

function entriesToWorkbookAndDownload(entries, filename, sheetName){

  /* Sort newest-first so the exported sheet reads top-to-bottom
     the same way the site does. */

  const sorted =
    [...entries].sort(
      (a,b) =>
        new Date(b.date || 0) -
        new Date(a.date || 0)
    );


  const data = [];


  data.push(
    EXPORT_COLUMNS.map(col => col.header)
  );


  sorted.forEach(entry=>{

    data.push(

      EXPORT_COLUMNS.map(col=>{

        const value = entry[col.key];

        if(col.key === "pay" || col.key === "travel"){

          return Number(value || 0);

        }

        return value || "";

      })

    );

  });


  const worksheet =
    XLSX.utils.aoa_to_sheet(data);


  /* Column widths so the sheet is readable immediately instead
     of every column being squeezed to default width. */

  worksheet["!cols"] =
    EXPORT_COLUMNS.map(col => ({ wch: col.width }));


  /* Freeze the header row so it stays visible while scrolling
     through a long sheet. */

  worksheet["!freeze"] = { xSplit:0, ySplit:1 };

  worksheet["!autofilter"] =
    { ref: "A1:" + XLSX.utils.encode_col(EXPORT_COLUMNS.length - 1) + (sorted.length + 1) };


  const workbook =
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    (sheetName || "Shoots").slice(0, 31)
  );


  XLSX.writeFile(workbook, filename);

}

function exportToExcel(){

  waitForXlsxThenRun(()=>{

    entriesToWorkbookAndDownload(

      state.entries,

      "Team-Kabira-Shoots-" +
        todayISO() +
        ".xlsx",

      "Shoots"

    );

  });

}

function exportMemberToExcel(memberName){

  const stats =
    getMemberStats(memberName);


  if(!stats.entries.length){

    alert(
      "No records found for " +
        memberName +
        "."
    );

    return;

  }


  waitForXlsxThenRun(()=>{

    const safeName =
      memberName
        .trim()
        .replace(/[^a-z0-9]+/gi, "-");

    entriesToWorkbookAndDownload(

      stats.entries,

      "Team-Kabira-" +
        safeName +
        "-" +
        todayISO() +
        ".xlsx",

      memberName.slice(0, 28)

    );

  });

}


/* ============================================================
   MEMBER STATISTICS
   ============================================================ */

function getMemberStats(memberName){

  const normalized =
    memberName.trim().toLowerCase();


  const memberEntries =
    state.entries.filter(

      entry =>
        String(entry.member || "")
          .toLowerCase() ===
        normalized

    );


  const totalShots =
    memberEntries.length;


  const delivered =
    memberEntries.filter(
      entry =>
        entry.status === "Delivered"
    ).length;


  const totalPay =
    memberEntries.reduce(

      (sum,entry)=>
        sum +
        Number(entry.pay || 0),

      0

    );


  const totalTravel =
    memberEntries.reduce(

      (sum,entry)=>
        sum +
        Number(entry.travel || 0),

      0

    );


  return {

    totalShots,

    delivered,

    totalPay,

    totalTravel,

    entries:memberEntries

  };

}

function openEditEntry(entry){

  /* Work on a copy so cancelling doesn't mutate the real entry */

  state.editingEntry = {

    id: entry.id,

    member: entry.member || "",

    date: entry.date || todayISO(),

    brand: entry.brand || "",

    contentType: entry.contentType || CONTENT_TYPES[0],

    location: entry.location || "",

    status: entry.status || STATUSES[0],

    notes: entry.notes || "",

    approvedBy: entry.approvedBy || "",

    coordinator: entry.coordinator || "",

    reelTopic: entry.reelTopic || "",

    pay: entry.pay ?? "",

    travel: entry.travel ?? ""

  };

  state.editMsg = null;

  render();

  const anchor = document.getElementById("edit-entry-panel");

  if(anchor){
    anchor.scrollIntoView({ behavior:"smooth", block:"start" });
  }

}

function closeEditEntry(){

  state.editingEntry = null;

  state.editMsg = null;

  render();

}

async function saveEditEntry(){

  if(!state.editingEntry) return;


  if(!state.editingEntry.brand.trim()){

    state.editMsg = { type:"err", text:"Brand is required." };

    render();

    return;

  }


  state.editSaving = true;

  render();


  const idx =
    state.entries.findIndex(
      e => e.id === state.editingEntry.id
    );


  if(idx === -1){

    state.editSaving = false;

    state.editMsg = { type:"err", text:"That entry no longer exists." };

    render();

    return;

  }


  const updated = {

    ...state.entries[idx],

    member: state.editingEntry.member.trim(),

    date: state.editingEntry.date,

    brand: state.editingEntry.brand.trim(),

    contentType: state.editingEntry.contentType,

    location: state.editingEntry.location.trim(),

    status: state.editingEntry.status,

    notes: state.editingEntry.notes.trim(),

    approvedBy: state.editingEntry.approvedBy.trim(),

    coordinator: state.editingEntry.coordinator.trim(),

    reelTopic: state.editingEntry.reelTopic.trim(),

    pay: state.editingEntry.pay ? parseFloat(state.editingEntry.pay) : 0,

    travel: state.editingEntry.travel ? parseFloat(state.editingEntry.travel) : 0

  };


  state.entries[idx] = updated;

  cacheEntries();


  try{

    await saveEntries();

    state.editingEntry = null;

    state.editMsg = null;

  }catch(error){

    state.editMsg = {
      type:"info",
      text:"⚠ Saved on this device — couldn't sync to Firebase yet (check Firebase Rules)."
    };

    state.editingEntry = null;

  }


  state.editSaving = false;

  render();

}

async function deleteEntry(id){

  const target =
    state.entries.find(e => e.id === id);


  const label =
    target
      ? (target.brand || "this shoot") + " — " + (target.member || "unknown")
      : "this shoot";


  if(!confirm("Delete " + label + "? This cannot be undone.")){

    return;

  }


  state.entries =
    state.entries.filter(e => e.id !== id);

  cacheEntries();

  try{ localStorage.removeItem(LS_SHOT_PREFIX+id); }catch(e){}
  if(db){ db.ref("screenshots/"+id).remove().catch(()=>{}); }


  if(
    state.editingEntry &&
    state.editingEntry.id === id
  ){

    state.editingEntry = null;

  }


  render();


  try{

    await saveEntries();

  }catch(error){

    console.error("Delete failed to sync to Firebase (removed locally, will retry on next sync):", error);

  }

}

function newBrandForm(){

  const counts = {};

  POST_TYPES.forEach(type=>{ counts[type] = 0; });

  return {
    id:null,
    name:"",
    counts,
    days:[0,1,2,3,4,5,6],
    notes:""
  };

}

function normName(value){

  return String(value || "").trim().toLowerCase();

}

function brandCounts(brand){

  const counts = {};

  POST_TYPES.forEach(type=>{
    counts[type] = Number((brand.counts || {})[type]) || 0;
  });

  return counts;

}

function brandDays(brand){

  const raw = brand.days || [];

  return (Array.isArray(raw) ? raw : Object.values(raw))
    .map(Number)
    .filter(n=>n >= 0 && n <= 6);

}

function pluralType(type,n){

  if(n === 1) return type;

  return type === "Story" ? "Stories" : type + "s";

}

function brandDailyText(brand){

  const counts = brandCounts(brand);

  const parts =
    POST_TYPES
      .filter(type=>counts[type] > 0)
      .map(type=>counts[type] + " " + pluralType(type,counts[type]));

  return parts.length
    ? parts.join(" + ") + " / day"
    : "No daily target set";

}

function brandDaysText(brand){

  const days = brandDays(brand).sort((a,b)=>a-b);

  if(days.length === 7) return "Every day";

  if(!days.length) return "No days selected";

  return days.map(i=>DAY_NAMES[i]).join(", ");

}

function brandWeeklyTotal(brand){

  const counts = brandCounts(brand);

  const perDay =
    Object.values(counts).reduce((sum,n)=>sum + n,0);

  return perDay * brandDays(brand).length;

}

function flashMsg(key,msg,ms){

  state[key] = msg;

  render();

  setTimeout(()=>{

    state[key] = null;

    render();

  }, ms || 3500);

}

async function submitBrandForm(){

  const f = state.brandForm;

  const name = f.name.trim();

  if(!name){

    state.brandMsg = { type:"err", text:"Enter a brand name." };

    render();

    return;

  }

  if(state.brands.some(b=>normName(b.name) === normName(name) && b.id !== f.id)){

    state.brandMsg = { type:"err", text:"A brand with that name already exists." };

    render();

    return;

  }

  const counts = {};

  POST_TYPES.forEach(type=>{

    const n = Math.floor(Number(f.counts[type])) || 0;

    counts[type] = Math.max(0, Math.min(50, n));

  });

  if(Object.values(counts).every(n=>n === 0)){

    state.brandMsg = {
      type:"err",
      text:"Set at least one daily target (for example 2 Reels)."
    };

    render();

    return;

  }

  if(!f.days.length){

    state.brandMsg = { type:"err", text:"Pick at least one posting day." };

    render();

    return;

  }

  const wasEditing = !!f.id;

  const data = {
    id: f.id || Date.now().toString(),
    name,
    counts,
    days: f.days.slice().sort((a,b)=>a-b),
    notes: f.notes.trim()
  };

  const existingBrand = state.brands.find(b=>b.id === f.id);

  if(existingBrand && existingBrand.manual){ data.manual = existingBrand.manual; }

  if(existingBrand && existingBrand.overrides){ data.overrides = existingBrand.overrides; }

  if(wasEditing){

    const index = state.brands.findIndex(b=>b.id === f.id);

    if(index >= 0){ state.brands[index] = data; }
    else{ state.brands.push(data); }

  }else{

    state.brands.push(data);

  }

  state.brands.sort(
    (a,b)=>String(a.name||"").localeCompare(String(b.name||""))
  );

  state.brandForm = newBrandForm();

  cacheBrands();

  let msg;

  try{

    await saveBrands();

    msg = {
      type:"ok",
      text: wasEditing
        ? "\u2713 " + name + " updated."
        : "\u2713 " + name + " added. It now appears in the members' brand dropdown."
    };

  }catch(error){

    console.error(error);

    msg = {
      type:"info",
      text:"\u26a0 Saved on this device, but couldn't sync to Firebase yet (check Firebase Rules)."
    };

  }

  flashMsg("brandMsg",msg);

}

function startEditBrand(brand){

  state.brandForm = {
    id: brand.id,
    name: brand.name,
    counts: brandCounts(brand),
    days: brandDays(brand),
    notes: brand.notes || ""
  };

  state.brandMsg = null;

  render();

  const target = document.getElementById("brand-form");

  if(target){ target.scrollIntoView({ behavior:"smooth", block:"start" }); }

}

async function deleteBrand(brand){

  if(!confirm(
    "Delete brand \"" + brand.name + "\"?\n\n" +
    "It will disappear from the members' dropdown. Shoots already logged for it are kept.\n" +
    "This cannot be undone."
  )){
    return;
  }

  state.brands = state.brands.filter(b=>b.id !== brand.id);

  if(state.brandForm.id === brand.id){ state.brandForm = newBrandForm(); }

  if(state.calBrandId === brand.id){ state.calBrandId = null; state.calDay = null; }

  cacheBrands();

  let msg;

  try{

    await saveBrands();

    msg = { type:"ok", text:"\u2713 " + brand.name + " deleted." };

  }catch(error){

    console.error(error);

    msg = {
      type:"info",
      text:"\u26a0 Deleted on this device, but couldn't sync to Firebase yet (check Firebase Rules)."
    };

  }

  flashMsg("brandMsg",msg);

}

/* ============================================================
   BRAND CALENDAR (target vs logged, per day)
   Counts every shoot logged for the brand on that date, by
   content type, against the brand's daily targets. It reads the
   same entries the members' form saves, so it updates itself.
   ============================================================ */

function pad2(n){ return String(n).padStart(2,"0"); }

function localISO(d){

  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());

}

function rerenderKeepScroll(){

  const y = window.scrollY;

  render();

  window.scrollTo(0,y);

}

function openBrandCalendar(id){

  if(state.calBrandId === id){

    state.calBrandId = null;

    state.calDay = null;

    rerenderKeepScroll();

    return;

  }

  const now = new Date();

  state.calBrandId = id;

  state.calMonth = now.getFullYear() + "-" + pad2(now.getMonth()+1);

  state.calDay = null;

  render();

  const target = document.getElementById("brand-calendar");

  if(target){ target.scrollIntoView({ behavior:"smooth", block:"start" }); }

  refreshFromCloud();

}

function shiftCalMonth(delta){

  const [y,m] = state.calMonth.split("-").map(Number);

  const d = new Date(y, m-1+delta, 1);

  state.calMonth = d.getFullYear() + "-" + pad2(d.getMonth()+1);

  state.calDay = null;

  rerenderKeepScroll();

}

/* Pull the latest entries/brands from the cloud so the calendar
   reflects what members logged on their own phones. Only runs when
   the connection test is green, so it can never wipe unsynced local
   work. Re-renders only if something actually changed. */

async function refreshFromCloud(){

  if(!db || state.connectionStatus.state !== "ok") return;

  const before = JSON.stringify([state.entries,state.brands]);

  try{

    const entriesData = (await db.ref("entries").once("value")).val();

    if(entriesData){

      state.entries =
        Object.values(entriesData).sort(
          (a,b)=>new Date(b.date || 0) - new Date(a.date || 0)
        );

      cacheEntries();

    }

    const brandsData = (await db.ref("brands").once("value")).val();

    if(brandsData && !state.brandsDirty){

      state.brands =
        Object.entries(brandsData)
          .filter(([k,v])=>k !== "_meta" && v && typeof v === "object")
          .map(([k,v])=>v)
          .sort((a,b)=>String(a.name||"").localeCompare(String(b.name||"")));

      cacheBrands();

    }

  }catch(error){

    console.error("Calendar refresh failed:", error);

    return;

  }

  const after = JSON.stringify([state.entries,state.brands]);

  const typing =
    document.activeElement &&
    /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);

  if(before !== after && state.view === "admin" && !state.editingEntry && !typing){

    rerenderKeepScroll();

  }

}

/* ---- per-day targets / admin adjustments -------------------------
   brand.overrides[date] = custom target for that single day
   brand.manual[date]    = posts the admin marked as done by hand
   Calendar total for a day = logged by the team + marked by admin.
   ------------------------------------------------------------------ */

function isoIdx(iso){

  const [y,m,d] = iso.split("-").map(Number);

  return (new Date(y,m-1,d).getDay() + 6) % 7;

}

function dayTargetsFor(brand,iso){

  const override = (brand.overrides || {})[iso];

  const counts = brandCounts(brand);

  const on = brandDays(brand).includes(isoIdx(iso));

  const result = {};

  POST_TYPES.forEach(type=>{

    result[type] = override
      ? Math.max(0, Number(override[type]) || 0)
      : (on ? counts[type] : 0);

  });

  return result;

}

function dayManualFor(brand,iso){

  const manual = (brand.manual || {})[iso] || {};

  const result = {};

  POST_TYPES.forEach(type=>{ result[type] = Math.max(0, Number(manual[type]) || 0); });

  return result;

}

function dayAdjusted(brand,iso){

  return !!((brand.overrides || {})[iso]) ||
    Object.values(dayManualFor(brand,iso)).some(n=>n > 0);

}

async function persistBrandChange(){

  cacheBrands();

  rerenderKeepScroll();

  try{

    await saveBrands();

    state.calMsg = { type:"ok", text:"\u2713 Calendar updated." };

  }catch(error){

    console.error(error);

    state.calMsg = {
      type:"info",
      text:"\u26a0 Saved on this device, but couldn't sync to Firebase yet."
    };

  }

  rerenderKeepScroll();

}

function adjustManual(brand,iso,type,delta){

  brand.manual = brand.manual || {};

  const day = brand.manual[iso] = brand.manual[iso] || {};

  day[type] = Math.max(0, Math.min(99, (Number(day[type]) || 0) + delta));

  if(Object.values(day).every(n=>!n)){ delete brand.manual[iso]; }

  persistBrandChange();

}

function setTargetOverride(brand,iso,type,value){

  brand.overrides = brand.overrides || {};

  if(!brand.overrides[iso]){ brand.overrides[iso] = dayTargetsFor(brand,iso); }

  brand.overrides[iso][type] =
    Math.max(0, Math.min(50, Math.floor(Number(value)) || 0));

  persistBrandChange();

}

function resetDayAdjustments(brand,iso){

  if(brand.overrides){ delete brand.overrides[iso]; }

  if(brand.manual){ delete brand.manual[iso]; }

  persistBrandChange();

}

function renderBrandCalendar(brand){

  const box = el("div",{
    id:"brand-calendar",
    style:"margin-top:26px;border-top:1px solid var(--rule);padding-top:20px;"
  });

  const [Y,M] = state.calMonth.split("-").map(Number);

  const first = new Date(Y,M-1,1);

  const monthLabel =
    first.toLocaleDateString("en-IN",{ month:"long", year:"numeric" });

  const todayStr = localISO(new Date());

  const bn = normName(brand.name);

  /* logged[date][type] = shoots members logged through the form */

  const logged = {};

  state.entries.forEach(entry=>{

    if(!entry.date || normName(entry.brand) !== bn) return;

    logged[entry.date] = logged[entry.date] || {};

    logged[entry.date][entry.contentType] =
      (logged[entry.date][entry.contentType] || 0) + 1;

  });

  const postedFor = (iso,type)=>
    ((logged[iso] || {})[type] || 0) + dayManualFor(brand,iso)[type];

  /* header + controls */

  const head = el("div",{
    style:"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;"
  });

  const titleBox = el("div");

  titleBox.appendChild(el("h3",{
    text:brand.name + " \u2014 content calendar",
    style:"margin:0;font-size:15px;"
  }));

  titleBox.appendChild(el("div",{
    text:"Default target: " + brandDailyText(brand) + " \u00b7 " + brandDaysText(brand),
    style:"font-size:12.5px;color:var(--ink-dim);margin-top:3px;"
  }));

  head.appendChild(titleBox);

  const controls = el("div",{ style:"display:flex;flex-wrap:wrap;align-items:center;" });

  controls.appendChild(el("button",{
    class:"btn-small", text:"\u2039", title:"Previous month",
    onclick:()=>{ shiftCalMonth(-1); }
  }));

  controls.appendChild(el("span",{
    text:monthLabel,
    style:"font-size:13px;font-weight:600;min-width:130px;text-align:center;margin-left:8px;"
  }));

  controls.appendChild(el("button",{
    class:"btn-small", text:"\u203a", title:"Next month",
    onclick:()=>{ shiftCalMonth(1); }
  }));

  controls.appendChild(el("button",{
    class:"btn-small", text:"Today",
    onclick:()=>{
      const n = new Date();
      state.calMonth = n.getFullYear() + "-" + pad2(n.getMonth()+1);
      state.calDay = null;
      rerenderKeepScroll();
    }
  }));

  controls.appendChild(el("button",{
    class:"btn-small", text:"Refresh",
    onclick:()=>{ refreshFromCloud(); }
  }));

  controls.appendChild(el("button",{
    class:"btn-small", text:"Edit defaults",
    onclick:()=>{ startEditBrand(brand); }
  }));

  controls.appendChild(el("button",{
    class:"btn-small", text:"Close",
    onclick:()=>{ openBrandCalendar(brand.id); }
  }));

  head.appendChild(controls);

  box.appendChild(head);

  /* month figures */

  const daysInMonth = new Date(Y,M,0).getDate();

  let targetSoFar = 0, doneSoFar = 0, missedDays = 0, completeDays = 0, activeDays = 0, monthTarget = 0;

  for(let d=1; d<=daysInMonth; d++){

    const iso = Y + "-" + pad2(M) + "-" + pad2(d);

    const targets = dayTargetsFor(brand,iso);

    const sum = POST_TYPES.reduce((a,t)=>a + targets[t],0);

    monthTarget += sum;

    if(!sum || iso > todayStr) continue;

    activeDays++;

    let allMet = true;

    POST_TYPES.forEach(type=>{

      if(!targets[type]) return;

      const got = postedFor(iso,type);

      targetSoFar += targets[type];

      doneSoFar += Math.min(got,targets[type]);

      if(got < targets[type]) allMet = false;

    });

    if(allMet){ completeDays++; }
    else if(iso < todayStr){ missedDays++; }

  }

  const pct = targetSoFar ? Math.round(doneSoFar / targetSoFar * 100) : 0;

  const stats = el("div",{ class:"member-stats", style:"margin-bottom:14px;" });

  [
    ["Posted vs target (to date)", doneSoFar + " / " + targetSoFar + " (" + pct + "%)"],
    ["Days fully done", completeDays + " of " + activeDays],
    ["Days missed", String(missedDays)],
    ["Posts needed this month", String(monthTarget)]
  ].forEach(([label,value])=>{

    const stat = el("div",{ class:"member-stat" });

    stat.appendChild(el("div",{ class:"label", text:label }));

    stat.appendChild(el("div",{ class:"value", text:value }));

    stats.appendChild(stat);

  });

/* ============================================================
   MESSAGES  (admin -> one person)
   Each message is its own Firebase child (messages/<id>), so a
   person marking theirs as read can never overwrite the admin's
   other messages.
   ============================================================ */

async function loadMessages(){

  if(!db) return false;

  try{

    const snap = await db.ref("messages").once("value");

    const data = snap.val();

    state.messages =
      data
        ? Object.values(data)
            .filter(m=>m && m.id && m.to && m.text)
            .sort((a,b)=>(b.createdAt || 0) - (a.createdAt || 0))
        : [];

    return true;

  }catch(error){

    console.error("Load messages failed:", error);

    return false;

  }

}

async function sendMessage(){

  const to = state.msgForm.to;

  const text = state.msgForm.text.trim();

  if(!to){

    flashMsg("msgNotice",{ type:"err", text:"Choose who the message is for." });

    return;

  }

  if(!text){

    flashMsg("msgNotice",{ type:"err", text:"Write a message first." });

    return;

  }

  if(!db){

    flashMsg("msgNotice",{ type:"err", text:"Couldn't send: no connection to Firebase." });

    return;

  }

  const message = {
    id:"m" + Date.now(),
    to,
    text:text.slice(0,500),
    from:"Admin",
    createdAt:Date.now()
  };

  try{

    await db.ref("messages/" + message.id).set(message);

  }catch(error){

    console.error(error);

    flashMsg("msgNotice",{
      type:"err",
      text:"Couldn't send. Check your connection and Firebase Rules (the 'messages' path must be writable)."
    });

    return;

  }

  state.messages.unshift(message);

  state.msgForm.text = "";

  flashMsg("msgNotice",{ type:"ok", text:"\u2713 Sent to " + to + "." });

}

async function markMessageRead(id){

  const message = state.messages.find(m=>m.id === id);

  if(!message) return;

  message.readAt = Date.now();

  rerenderKeepScroll();

  try{

    await db.ref("messages/" + id).update({ readAt:message.readAt });

  }catch(error){

    console.error("Could not save read receipt:", error);

  }

}

async function deleteMessage(id){

  state.messages = state.messages.filter(m=>m.id !== id);

  rerenderKeepScroll();

  try{

    await db.ref("messages/" + id).remove();

  }catch(error){

    console.error("Could not delete message:", error);

  }

}

   PEOPLE — DELETE A PERSON (admin)
   ============================================================ */

async function deleteMember(name){

  const shootCount =
    state.entries.filter(entry=>entry.member === name).length;

  if(!confirm(
    "Delete " + name + "?\n\n" +
    "They will be removed from the name list. " +
    (shootCount
      ? "Their " + shootCount + " logged shoot(s) are kept in the records."
      : "They have no logged shoots.") +
    "\nThis cannot be undone."
  )){
    return;
  }

  state.members = state.members.filter(m=>m !== name);

  if(state.currentUser === name){

    state.currentUser = null;

    localStorage.removeItem("currentUser");

  }

  cacheMembers();

  let msg;

  try{

    await saveMembers();

    msg = { type:"ok", text:"\u2713 " + name + " deleted." };

  }catch(error){

    console.error(error);

    msg = {
      type:"info",
      text:"\u26a0 Deleted on this device, but couldn't sync to Firebase yet (check Firebase Rules)."
    };

  }

  flashMsg("peopleMsg",msg);

}

    if(memberStats.totalShots === 0){

      searchSection.appendChild(

        el("div",{

          class:"empty",

          text:
            "No shoots found for that name."

        })

      );

    }else{

      /* PER-MEMBER EXPORT BUTTON */

      const memberButtonGroup =
        el("div",{
          class:"button-group"
        });


      memberButtonGroup.appendChild(

        el("button",{

          class:"secondary",

          text:
            "📥 Export " +
            state.searchMember.trim() +
            "'s shoots",

          onclick:()=>{

            exportMemberToExcel(
              state.searchMember.trim()
            );

          }

        })

      );


      searchSection.appendChild(
        memberButtonGroup
      );


      const memberStatsGrid =
        el("div",{
          class:"member-stats"
        });


      [
        ["Total Shoots",memberStats.totalShots],

        ["Delivered",memberStats.delivered],

        [
          "Total Pay",
          "₹" +
          memberStats.totalPay
            .toLocaleString("en-IN")
        ],

        [
          "Total Travel",
          "₹" +
          memberStats.totalTravel
            .toLocaleString("en-IN")
        ]

      ].forEach(([label,value])=>{

        const stat =
          el("div",{
            class:"member-stat"
          });


        stat.appendChild(

          el("div",{
            class:"label",
            text:label
          })

        );


        stat.appendChild(

          el("div",{
            class:"value",
            text:String(value)
          })

        );


        memberStatsGrid.appendChild(stat);

      });


      searchSection.appendChild(
        memberStatsGrid
      );


      /* RECORDS */

      const details =
        el("div",{
          class:"member-details"
        });


      details.appendChild(

        el("h3",{
          text:"Shoots"
        })

      );


      const table =
        el("table",{
          class:"data-table"
        });


      const thead =
        el("thead");


      const headerRow =
        el("tr");


      [
        "Date",
        "Brand",
        "Topic",
        "Content",
        "Approved By",
        "Coordinator",
        "Pay",
        "Travel",
        "Status",
        "Screenshot",
        "Actions"
      ].forEach(header=>{

        headerRow.appendChild(
          el("th",{text:header})
        );

      });


      thead.appendChild(headerRow);

      table.appendChild(thead);


      const tbody =
        el("tbody");


      memberStats.entries.forEach(entry=>{

        const row =
          el("tr");


        row.appendChild(
          el("td",{
            text:fmtDate(entry.date)
          })
        );


        row.appendChild(
          el("td",{
            text:entry.brand || "-"
          })
        );


        row.appendChild(
          el("td",{
            text:entry.reelTopic || "-"
          })
        );


        row.appendChild(
          el("td",{
            text:entry.contentType || "-"
          })
        );


        row.appendChild(
          el("td",{
            text:entry.approvedBy || "-"
          })
        );


        row.appendChild(
          el("td",{
            text:entry.coordinator || "-"
          })
        );


        row.appendChild(
          el("td",{
            class:"number",
            text:
              "₹" +
              Number(entry.pay || 0)
                .toLocaleString("en-IN")
          })
        );


        row.appendChild(
          el("td",{
            class:"number",
            text:
              "₹" +
              Number(entry.travel || 0)
                .toLocaleString("en-IN")
          })
        );


        row.appendChild(
          el("td",{
            text:entry.status || "-"
          })
        );


        row.appendChild(adminShotCell(entry));
      const actionsCell = el("td",{});

        actionsCell.appendChild(

          el("button",{

            class:"btn-edit",

            text:"Edit",

            onclick:()=>{ openEditEntry(entry); }

          })

        );

        actionsCell.appendChild(

          el("button",{

            class:"btn-delete",

            text:"Delete",

            onclick:()=>{ deleteEntry(entry.id); }

          })

        );

        row.appendChild(actionsCell);


        tbody.appendChild(row);

      });


      table.appendChild(tbody);


      const tableWrapper =
        el("div",{
          class:"table-wrapper"
        });


      tableWrapper.appendChild(table);

      details.appendChild(tableWrapper);

      searchSection.appendChild(details);

    }

  }


  wrap.appendChild(searchSection);


  /* SHOOTS PER MEMBER */

  wrap.appendChild(

    el("div",{
      class:"section-title",
      text:"Shoots per person"
    })

  );


  const counts = {};


  state.entries.forEach(entry=>{

    const name =
      entry.member || "Unknown";


    counts[name] =
      (counts[name] || 0) + 1;

  });


  const countValues =
    Object.values(counts);


  const maxCount =
    Math.max(
      1,
      ...countValues
    );


  const barsWrap =
    el("div",{});


  const allNames =
    Array.from(

      new Set([

        ...state.members,

        ...Object.keys(counts)

      ])

    );


  if(!allNames.length){

    barsWrap.appendChild(

      el("div",{
        class:"empty",
        text:"No one has been added yet."
      })

    );

  }else{

    allNames.forEach(name=>{

      const count =
        counts[name] || 0;


      const row =
        el("div",{
          class:"bar-row"
        });


      row.appendChild(

        el("div",{
          class:"name",
          text:name
        })

      );


      const track =
        el("div",{
          class:"bar-track"
        });


      const fill =
        el("div",{
          class:"bar-fill"
        });


      fill.style.width =
        Math.round(
          (count / maxCount) * 100
        ) + "%";


      track.appendChild(fill);

      row.appendChild(track);


      row.appendChild(

        el("div",{
          class:"cnt",
          text:String(count)
        })

      );


      /* Quick per-member export button on each bar row */

      row.appendChild(

        el("button",{

          class:"btn-icon",

          text:"Download",

          title:
            "Download " +
            name +
            "'s shoots as Excel",

          onclick:()=>{

            exportMemberToExcel(name);

          }

        })

      );


      barsWrap.appendChild(row);

    });

  }


  wrap.appendChild(barsWrap);


  /* ALL LOGS */

  wrap.appendChild(

    el("div",{
      class:"section-title",
      text:"Everyone's shoots"
    })

  );


  const table =
    el("table",{
      class:"data-table"
    });


  const thead =
    el("thead");


  const headerRow =
    el("tr");


  [
    "Date",
    "Member",
    "Brand",
    "Topic",
    "Content",
    "Approved By",
    "Coordinator",
    "Pay",
    "Travel",
    "Status",
    "Screenshot",
    "Actions"
  ].forEach(header=>{

    headerRow.appendChild(
      el("th",{text:header})
    );

  });


  thead.appendChild(headerRow);

  table.appendChild(thead);


  const tbody =
    el("tbody");


  if(!state.entries.length){

    const row =
      el("tr");


    row.appendChild(

      el("td",{

        colSpan:"12",

        text:"No shoots yet",

        style:
          "text-align:center;padding:20px;color:var(--ink-dim)"

      })

    );


    tbody.appendChild(row);

  }else{

    state.entries.forEach(entry=>{

      const row =
        el("tr");


      row.appendChild(
        el("td",{
          text:fmtDate(entry.date)
        })
      );


      row.appendChild(
        el("td",{
          text:entry.member || "-"
        })
      );


      row.appendChild(
        el("td",{
          text:entry.brand || "-"
        })
      );


      row.appendChild(
        el("td",{
          text:entry.reelTopic || "-"
        })
      );


      row.appendChild(
        el("td",{
          text:entry.contentType || "-"
        })
      );


      row.appendChild(
        el("td",{
          text:entry.approvedBy || "-"
        })
      );


      row.appendChild(
        el("td",{
          text:entry.coordinator || "-"
        })
      );


      row.appendChild(
        el("td",{
          class:"number",
          text:
            "₹" +
            Number(entry.pay || 0)
              .toLocaleString("en-IN")
        })
      );


      row.appendChild(
        el("td",{
          class:"number",
          text:
            "₹" +
            Number(entry.travel || 0)
              .toLocaleString("en-IN")
        })
      );


      row.appendChild(
        el("td",{
          text:entry.status || "-"
        })
      );


      row.appendChild(adminShotCell(entry));
      const actionsCell = el("td",{});

      actionsCell.appendChild(

        el("button",{

          class:"btn-edit",

          text:"Edit",

          onclick:()=>{ openEditEntry(entry); }

        })

      );

      actionsCell.appendChild(

        el("button",{

          class:"btn-delete",

          text:"Delete",

          onclick:()=>{ deleteEntry(entry.id); }

        })

      );

      row.appendChild(actionsCell);


      tbody.appendChild(row);

    });

  }


  table.appendChild(tbody);


  const tableWrapper =
    el("div",{
      class:"table-wrapper"
    });


  tableWrapper.appendChild(table);

  wrap.appendChild(tableWrapper);


  return wrap;

}


/* ============================================================
   ADMIN LOGIN
   ============================================================ */

function renderAdminGate(){

  const wrap =
    el("div",{
      class:"wrap"
    });


  const slate =
    el("div",{
      class:"slate"
    });


  slate.appendChild(
    el("div",{
      class:"slate-stripe"
    })
  );


  const body =
    el("div",{
      class:"slate-body"
    });


  body.appendChild(

    el("h2",{
      text:"Team leader login"
    })

  );


  const passField =
    el("div",{
      class:"field"
    });


  passField.appendChild(

    el("label",{
      text:"Passcode"
    })

  );


  const passInput =
    el("input",{
      type:"password",
      placeholder:"enter passcode"
    });


  passInput.addEventListener(
    "input",
    e=>{
      state.adminPass =
        e.target.value;
    }
  );


  passInput.addEventListener(
    "keydown",
    e=>{

      if(e.key === "Enter"){

        attemptAdminLogin();

      }

    }
  );


  passField.appendChild(passInput);

  body.appendChild(passField);


  body.appendChild(

    el("button",{

      class:"primary",

      text:"Enter",

      onclick:attemptAdminLogin

    })

  );


  if(state.adminMsg){

    body.appendChild(

      el("div",{

        class:
          "msg " +
          state.adminMsg.type,

        text:
          state.adminMsg.text

      })

    );

  }


  slate.appendChild(body);

  wrap.appendChild(slate);


  return wrap;

}


/* ============================================================
   ADMIN LOGIN FUNCTION
   ============================================================ */

function attemptAdminLogin(){

  if(
    state.adminPass ===
    ADMIN_PASSCODE
  ){

    state.view = "admin";

    state.adminPass = "";

    state.adminMsg = null;

    render();

  }else{

    state.adminMsg = {

      type:"err",

      text:"❌ Wrong passcode"

    };

    render();

  }

}


/* ============================================================
   MAIN RENDER
   ============================================================ */

function render(){

  const app =
    document.getElementById("app");


  app.innerHTML = "";


  if(state.view === "loading"){

    app.appendChild(

      el("div",{

        class:"wrap",

        style:
          "text-align:center;padding-top:100px;color:var(--ink-dim);font-family:'Inter',sans-serif;font-size:13px;",

        html:
          '<div class="loading-spinner"></div><p>Connecting to Team Kabira...</p>'

      })

    );

    return;

  }


  if(state.view === "error"){

    app.appendChild(

      el("div",{

        class:"wrap",

        style:
          "text-align:center;padding-top:100px;color:var(--accent);font-family:'Inter',sans-serif;font-size:13px;",

        html:
          `
          <h2>Firebase Connection Error</h2>
          <p>${state.errorMsg}</p>
          <button class="ghost" onclick="location.reload()">
            Retry
          </button>
          `

      })

    );

    return;

  }


  if(state.view === "gate"){

    app.appendChild(
      renderGate()
    );

  }

  else if(state.view === "admin-gate"){

    app.appendChild(
      renderAdminGate()
    );

  }

  else if(state.view === "member"){

    app.appendChild(
      renderMember()
    );

  }

  else if(state.view === "admin"){

    app.appendChild(
      renderAdmin()
    );

  }

}


/* ============================================================
   START APPLICATION
   ============================================================ */

window.addEventListener(
  "load",
  loadAll
);

/* New messages / read receipts show up without a manual refresh. */

setInterval(async ()=>{

  if(state.view !== "member" && state.view !== "admin") return;

  const before = JSON.stringify(state.messages);

  const ok = await loadMessages();

  if(!ok || before === JSON.stringify(state.messages)) return;

  const typing =
    document.activeElement &&
    /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);

  if(typing || state.editingEntry) return;

  rerenderKeepScroll();

}, 30000);

/* Keep an open brand calendar fresh while the admin leaves it on screen. */

setInterval(()=>{

  if(state.view === "admin" && state.calBrandId){

    refreshFromCloud();

  }

}, 30000);

</script>
